# Development container: the repo is mounted, Django's runserver reloads on changes.
#   docker compose -f docker-compose.dev.yml up --build
# Then open http://localhost:5051/. Settings come from app/.env (see app/.env.example).
services:
  web:
    build:
      context: .
      target: dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:5050"
    ports:
      - "127.0.0.1:5051:5050"
    volumes:
      - .:/srv/mlc      # includes ./var (the SQLite database), which git ignores
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MLC_DEBUG: "1"
