# Development container: the repo is mounted, Flask runs in debug mode with reload.
#   docker compose -f docker-compose.dev.yml up --build
# Then open http://localhost:5051/. Settings come from app/.env (see app/.env.example).
services:
  web:
    build:
      context: .
      target: dev
    command: flask --app app run --debug --host 0.0.0.0 --port 5050
    ports:
      - "127.0.0.1:5051:5050"
    volumes:
      - .:/srv/mlc
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
